server:
  host: "0.0.0.0"
  port: 8080
  log_level: "debug"

database:
  driver: "mysql"
  dsn: "root:root@tcp(db:3306)/ohmyadmin?parseTime=true&charset=utf8mb4"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 300
  conn_max_idle_time: 120

auth:
  jwt_secret: "change-this-to-a-random-secret-in-production"
  jwt_expiration: 86400

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://localhost:8081"
    - "*"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    - "PATCH"
  allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
  exposed_headers:
    - "Content-Length"
    - "Content-Type"
  max_age: 86400
